[info]
; The id is used internally and must be unique. Stick with snake_case.
id = example_module
name = Example Module
author = Your Name
description = A minimal frontend-only widget module.
version = 1.0.0
; Lucide icon shown in the module list (browse icons at lucide.dev)
icon = box
url = https://github.com/you/homy-example-module
; Which language file to load when the user's locale isn't available
default_language = enUS

; Auto-refresh interval in seconds for all widgets in this module.
; 0 means off — the widget only renders on load or when the user clicks refresh.
default_refresh_interval = 0

; Override the interval per widget type if needed.
[refresh]
example_hello = 0
