[info]
; The id is used in 'integration_types' inside widget WIDGET dicts.
; It can differ from the folder name, but keeping them the same avoids confusion.
id = example_integration
name = Example REST API
author = Your Name
description = Example integration with API key auth and a built-in status widget.
version = 1.0.0
; Lucide icon for the integrations list
icon = plug
url = https://github.com/you/homy-example-integration
; Fallback language when the user's locale isn't available
default_language = enUS

; Per-widget auto-refresh defaults in seconds. Override with 0 to disable.
[refresh]
example_status = 30
