[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "homy"
version = "0.1.0"
description = "Homy — modular self-hosted homepage dashboard with drag-and-drop widgets"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Domenick Waldvogel", email = "domenick.waldvogel@domekologe.eu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
]
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "requests>=2.31.0",
    "icalendar>=5.0.11",
    "waitress>=2.1.0",
    "authlib>=1.3.0",
    "pyotp>=2.9.0",
    "APScheduler>=3.10.0",
    "qrcode>=7.4",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
ldap = [
    "ldap3>=2.9",
]
saml = [
    "python3-saml>=1.16.0",
]
full = [
    "ldap3>=2.9",
    "python3-saml>=1.16.0",
]

[project.scripts]
homy = "homy.app:main"

[tool.hatch.build.targets.wheel]
packages = ["homy"]

[tool.hatch.build.targets.sdist]
include = [
    "/homy",
    "/README.md",
    "/MANIFEST.in",
    "/pyproject.toml",
]
