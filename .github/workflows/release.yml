# Create GitHub Release + publish Docker image to GHCR when [project].version in pyproject.toml changes.
name: Release & Docker

on:
  push:
    branches:
      - main
      - master
    paths:
      - pyproject.toml
  workflow_dispatch:
    inputs:
      force:
        description: Force release (even if version unchanged)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare versions
        id: check
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          set -euo pipefail
          extract_version() {
            grep -E '^version[[:space:]]*=' "$1" | head -1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'
          }

          NEW="$(extract_version pyproject.toml)"
          if [ -z "$NEW" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi

          OLD=""
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git show HEAD^:pyproject.toml > /tmp/pyproject.old.toml 2>/dev/null || true
            if [ -f /tmp/pyproject.old.toml ]; then
              OLD="$(extract_version /tmp/pyproject.old.toml || true)"
            fi
          fi

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW (previous: ${OLD:-<none>})"

          RELEASE=false
          if [ "$FORCE_RELEASE" = "true" ]; then
            RELEASE=true
          elif [ "$NEW" != "$OLD" ]; then
            RELEASE=true
          fi

          if [ "$RELEASE" = "true" ]; then
            if git ls-remote --tags origin "refs/tags/v${NEW}" | grep -q "v${NEW}"; then
              echo "::notice::Tag v${NEW} already exists — skipping release & docker publish"
              RELEASE=false
            fi
          fi

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  github-release:
    name: GitHub Release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build browser extension
        env:
          HOMY_VERSION: ${{ needs.version.outputs.version }}
        run: npm run build --prefix browser-extension

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Homy v${{ needs.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, 'alpha') || contains(needs.version.outputs.version, 'beta') || contains(needs.version.outputs.version, 'rc') }}
          files: |
            browser-extension/dist/homy-${{ needs.version.outputs.version }}-chrome.zip
            browser-extension/dist/homy-${{ needs.version.outputs.version }}-firefox.zip
            browser-extension/dist/homy-${{ needs.version.outputs.version }}-opera.zip

  docker:
    name: Build & push Docker image
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          IMAGE="$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`v${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker: \`${IMAGE}:${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker: \`${IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser extension: \`homy-${{ needs.version.outputs.version }}-{chrome,firefox,opera}.zip\`" >> "$GITHUB_STEP_SUMMARY"
